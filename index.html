<!DOCTYPE html>
<html lang="es">

<head>

<meta charset="UTF-8"> 

<meta
name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Radios Múltiples Admin
</title>

<link
rel="stylesheet"
href="style.css">

<link
rel="preconnect"
href="https://fonts.googleapis.com">

<link
href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
rel="stylesheet">

</head>

<body>

<div class="container">

<header>

<h1>
Radios Múltiples
</h1>

<p>
Panel Administrativo
</p>

</header>

<div class="stats">

<div class="card-stat">

<h2 id="pendientes">
0
</h2>

<span>
Pendientes
</span>

</div>

<div class="card-stat">

<h2 id="publicadas">
0
</h2>

<span>
Publicadas
</span>

</div>

<div class="card-stat">

<h2 id="total">
0
</h2>

<span>
Total
</span>

</div>

</div>

<div class="toolbar">

<input
type="text"
id="search"
placeholder="Buscar emisora...">

</div>

<div class="container">

    <!-- PENDIENTES -->
    <div id="tabPendientes" class="tab-content active">

        <h2 class="section-title">
            ⏳ Emisoras Pendientes
        </h2>

        <div id="pendientesContainer" class="grid"></div>

    </div>

    <!-- APROBADAS -->
    <div id="tabAprobadas" class="tab-content">

        <h2 class="section-title">
            ✅ Emisoras Aprobadas
        </h2>

        <div id="aprobadasContainer" class="grid"></div>

    </div>

    <!-- CONFIG -->
    <div id="tabConfig" class="tab-content">

        <h2 class="section-title">
            ⚙️ Configuración
        </h2>

        <div class="config-box">

            <button class="config-btn" onclick="loadRadios()">
                🔄 Actualizar Datos
            </button>

            <button class="config-btn">
                🌙 Tema Oscuro
            </button>

            <button class="config-btn">
                🚪 Cerrar Sesión
            </button>

        </div>

    </div>

</div>

</section>

</div>

<script src="app.js"></script>


<!-- MODAL EDITAR -->

<div id="editModal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2>
        ✏️ Editar Emisora
      </h2>

      <button
      class="close-modal"
      onclick="cerrarModal()">

        ×

      </button>

    </div>

    <div class="modal-body">

      <input
      type="hidden"
      id="editFila">

      <div class="form-group">

        <label>Nombre</label>

        <input
        type="text"
        id="editNombre">

      </div>

      <div class="form-group">

        <label>Ciudad</label>

        <input
        type="text"
        id="editCiudad">

      </div>

      <div class="form-group">

        <label>País</label>

        <input
        type="text"
        id="editPais">

      </div>

      <div class="form-group">

        <label>Stream</label>

        <input
        type="text"
        id="editStream">

      </div>

      <div class="form-group">

        <label>Logo</label>

        <input
        type="text"
        id="editLogo">

      </div>

      <div class="form-group">

        <label>Web</label>

        <input
        type="text"
        id="editWeb">

      </div>

      <div class="form-group">

        <label>WhatsApp</label>

        <input
        type="text"
        id="editWhatsapp">

      </div>

      <div class="form-group">

        <label>Facebook</label>

        <input
        type="text"
        id="editFacebook">

      </div>

      <div class="form-group">

        <label>Instagram</label>

        <input
        type="text"
        id="editInstagram">

      </div>

      <div class="form-group">

        <label>Descripción</label>

        <textarea
        id="editDescripcion"
        rows="5"></textarea>

      </div>

    </div>

    <div class="modal-footer">

      <button
      class="btn delete"
      onclick="cerrarModal()">

        Cancelar

      </button>

      <button
      class="btn approve"
      onclick="guardarEdicion()">

        Guardar Cambios

      </button>

    </div>

  </div>

</div>

<nav class="bottom-nav">

    <button
        class="nav-btn active"
        onclick="showTab('pendientes',this)">

        <span>⏳</span>
        <small>Pendientes</small>

    </button>

    <button
        class="nav-btn"
        onclick="showTab('aprobadas',this)">

        <span>✅</span>
        <small>Aprobadas</small>

    </button>

    <button
        class="nav-btn"
        onclick="showTab('config',this)">

        <span>⚙️</span>
        <small>Config.</small>

    </button>

</nav>

</body>

</html>
